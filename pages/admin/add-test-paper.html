<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Test Paper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Add New Test Paper</h4>
            <a href="manage-test-papers.html" class="btn btn-sm btn-outline-secondary">Back</a>
        </div>
        <div class="card-body">
            <form onsubmit="addTestPaper(event)">
                <div class="mb-3">
                    <label class="form-label">Test Paper Name</label>
                    <input type="text" id="paperName" class="form-control" placeholder="e.g. JavaScript Fundamentals" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Upload PDF</label>
                    <input type="file" id="paperPdf" class="form-control" accept=".pdf,application/pdf" required>
                    <div class="form-text">Select the PDF test paper file to attach with this entry.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select id="paperCategory" class="form-select" required>
                        <option value="">Select Category</option>
                        <option>Programming</option>
                        <option>Database</option>
                        <option>Web Development</option>
                        <option>Data Science</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Difficulty</label>
                    <select id="paperDifficulty" class="form-select" required>
                        <option value="">Select Level</option>
                        <option>Beginner</option>
                        <option>Intermediate</option>
                        <option>Advanced</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Duration (Minutes)</label>
                    <input type="number" id="paperDuration" class="form-control" min="10" value="30" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Questions</label>
                    <input type="number" id="paperQuestions" class="form-control" min="1" value="20" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="paperDescription" class="form-control" rows="4" placeholder="Brief description of the test paper"></textarea>
                </div>

                <button type="submit" class="btn btn-success">Add Test Paper</button>
                <a href="manage-test-papers.html" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

<script>
async function addTestPaper(event) {
    event.preventDefault();

    const name = document.getElementById('paperName').value.trim();
    const category = document.getElementById('paperCategory').value;
    const difficulty = document.getElementById('paperDifficulty').value;
    const duration = Number(document.getElementById('paperDuration').value);
    const questions = Number(document.getElementById('paperQuestions').value);
    const description = document.getElementById('paperDescription').value.trim();
    const pdfFile = document.getElementById('paperPdf').files[0];

    if (!name || !category || !difficulty || !duration || !questions || !pdfFile) {
        alert('Please fill in all required fields and upload a PDF.');
        return;
    }

    const formData = new FormData();
    formData.append('name', name);
    formData.append('category', category);
    formData.append('difficulty', difficulty);
    formData.append('duration', duration);
    formData.append('questions', questions);
    formData.append('description', description);
    formData.append('pdf', pdfFile);

    try {
        const response = await fetch('http://localhost:5000/api/test-papers', {
            method: 'POST',
            body: formData
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Failed to add test paper.');
        }

        alert('Test paper added successfully!');
        window.location.href = 'manage-test-papers.html';
    } catch (error) {
        alert(error.message || 'Unable to connect to the backend.');
    }
}
</script>
</body>
</html>
