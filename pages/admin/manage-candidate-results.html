<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Registration Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Candidate Registration Report</h2>
        <a href="dashboard.html" class="btn btn-outline-secondary">Back</a>
    </div>
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Find Candidate</h5>
            <form id="candidateLookupForm" class="row g-3 align-items-end">
                <div class="col-sm-6 col-md-4 col-lg-3">
                    <label class="form-label" for="candidateSelect">Candidate</label>
                    <select id="candidateSelect" class="form-select" required>
                        <option value="">Loading candidates...</option>
                    </select>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Fetch Report</button>
                </div>
            </form>
            <div id="lookupMessage" class="alert d-none mt-3 mb-0" role="alert"></div>
        </div>
    </div>
    <section id="candidateReport" class="card mb-4 d-none" aria-live="polite">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Candidate Details</h5>
            <div>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="printReport">Print Report</button>
                <button type="button" class="btn btn-sm btn-outline-danger ms-2" id="deleteCandidate">Delete Candidate</button>
            </div>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">User ID</dt><dd class="col-sm-9" id="reportUserId"></dd>
                <dt class="col-sm-3">Name</dt><dd class="col-sm-9" id="reportName"></dd>
                <dt class="col-sm-3">Email</dt><dd class="col-sm-9" id="reportEmail"></dd>
                <dt class="col-sm-3">Registered On</dt><dd class="col-sm-9" id="reportCreatedAt"></dd>
            </dl>
        </div>
    </section>
    <div class="table-responsive">
        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr><th>Candidate Name</th><th>Test Paper</th><th>Marks</th><th>Percentage</th><th>Submitted</th></tr>
            </thead>
            <tbody id="resultsBody"><tr><td colspan="5" class="text-center">Loading...</td></tr></tbody>
        </table>
    </div>
</div>
<script>
const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:5000'
    : `http://${window.location.hostname}:5000`;
const lookupForm = document.getElementById('candidateLookupForm');
const lookupMessage = document.getElementById('lookupMessage');
const candidateReport = document.getElementById('candidateReport');
const candidateSelect = document.getElementById('candidateSelect');

function setLookupMessage(message, type) {
    lookupMessage.textContent = message;
    lookupMessage.className = `alert alert-${type} mt-3 mb-0`;
}

function setReportValue(id, value) {
    document.getElementById(id).textContent = value;
}

lookupForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    candidateReport.classList.add('d-none');
    const userId = candidateSelect.value;

    try {
        const response = await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(userId)}`);
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Candidate not found.');
        }

        const user = result.user;
        setReportValue('reportUserId', user.id);
        setReportValue('reportName', user.name);
        setReportValue('reportEmail', user.email);
        setReportValue('reportCreatedAt', new Date(user.created_at).toLocaleString());
        candidateReport.classList.remove('d-none');
        lookupMessage.className = 'alert d-none';
    } catch (error) {
        setLookupMessage(error.message || 'Unable to fetch candidate details.', 'danger');
    }
});

async function loadCandidates() {
    try {
        const response = await fetch(`${API_BASE_URL}/api/users`);
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Unable to load candidates.');
        }

        const candidates = result.users.filter(user => user.role !== 'admin');
        candidateSelect.innerHTML = candidates.length
            ? '<option value="">Select a candidate</option>' + candidates.map(user =>
                `<option value="${user.id}">${user.name} - ${user.email}</option>`
            ).join('')
            : '<option value="">No registered candidates found</option>';
        candidateSelect.disabled = !candidates.length;

        const requestedUserId = new URLSearchParams(window.location.search).get('userId');
        if (requestedUserId && candidates.some(user => String(user.id) === requestedUserId)) {
            candidateSelect.value = requestedUserId;
            lookupForm.requestSubmit();
        }
    } catch (error) {
        candidateSelect.innerHTML = '<option value="">Unable to load candidates</option>';
        candidateSelect.disabled = true;
        setLookupMessage(error.message || 'Unable to load candidates.', 'danger');
    }
}

document.getElementById('printReport').addEventListener('click', function() {
    window.print();
});

document.getElementById('deleteCandidate').addEventListener('click', async function() {
    const userId = candidateSelect.value;
    const candidateName = document.getElementById('reportName').textContent;

    if (!userId || !window.confirm(`Delete candidate ${candidateName}? This action cannot be undone.`)) {
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(userId)}`, {
            method: 'DELETE'
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Unable to delete candidate.');
        }

        candidateReport.classList.add('d-none');
        candidateSelect.value = '';
        setLookupMessage('Candidate deleted successfully.', 'success');
        await loadCandidates();
    } catch (error) {
        setLookupMessage(error.message || 'Unable to delete candidate.', 'danger');
    }
});

async function loadResults() {
    const body = document.getElementById('resultsBody');
    try {
        const response = await fetch(`${API_BASE_URL}/api/candidate-results`);
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Failed to load results.');
        body.innerHTML = result.results.length ? result.results.map(item => `
            <tr><td>${item.candidate_name}</td><td>${item.test_paper_name}</td>
            <td>${item.marks} / ${item.total_marks}</td><td>${item.percentage}%</td>
            <td>${new Date(item.created_at).toLocaleString()}</td></tr>
        `).join('') : '<tr><td colspan="5" class="text-center text-muted">No results yet.</td></tr>';
    } catch (error) {
        body.innerHTML = `<tr><td colspan="5" class="text-center text-danger">${error.message}</td></tr>`;
    }
}
loadResults();
loadCandidates();
</script>
</body>
</html>
