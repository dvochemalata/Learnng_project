<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .sidebar {
            min-height: 100vh;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
        }

        .sidebar a:hover {
            background: #495057;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 bg-dark sidebar p-0">

            <h4 class="text-white text-center py-4">
                Admin Panel
            </h4>

            <a href="dashboard.html">Dashboard</a>
            <a href="manage-products.html">Products</a>
            <a href="manage-test-papers.html">Test Papers</a>
            <a href="manage-candidate-results.html">Candidate Results</a>
            <a href="manage-categories.html">Categories</a>
            <a href="manage-orders.html">Orders</a>
            <a href="manage-users.html">Users</a>
            <a href="reports.html">Reports</a>
            <a href="../../index.html">View Website</a>
            <a href="admin_login.html">Logout</a>

        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 p-4">

            <h2>Dashboard</h2>
            <hr>

            <div class="row g-4">

                <div class="col-md-6 col-xl-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6>Total Products</h6>
                            <h2>120</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6>Total Test Papers</h6>
                            <h2>18</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6>Total Orders</h6>
                            <h2>350</h2>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 col-xl-3">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h6>Total Users</h6>
                            <h2>580</h2>
                        </div>
                    </div>
                </div>

            </div>

            <div class="mt-4">
                <a href="manage-test-papers.html" class="btn btn-primary me-2">Manage Test Papers</a>
                <a href="add-test-paper.html" class="btn btn-success">+ Add Test Paper</a>
                <a href="manage-candidate-results.html" class="btn btn-outline-primary">Candidate Results</a>
            </div>

            <div class="card shadow-sm mt-4">
                <div class="card-body">
                    <h5 class="card-title">Manage Candidate Users</h5>
                    <div class="row g-3 align-items-end">
                        <div class="col-md-7 col-lg-6">
                            <label class="form-label" for="dashboardUserSelect">User ID and Candidate</label>
                            <select id="dashboardUserSelect" class="form-select">
                                <option value="">Loading users...</option>
                            </select>
                        </div>
                        <div class="col-auto">
                            <button type="button" id="viewUserButton" class="btn btn-outline-primary" disabled>View User</button>
                            <button type="button" id="deleteUserButton" class="btn btn-outline-danger" disabled>Delete User</button>
                        </div>
                    </div>
                    <div id="userActionMessage" class="alert d-none mt-3 mb-0" role="alert"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
    ? 'http://localhost:5000'
    : `http://${window.location.hostname}:5000`;
const dashboardUserSelect = document.getElementById('dashboardUserSelect');
const viewUserButton = document.getElementById('viewUserButton');
const deleteUserButton = document.getElementById('deleteUserButton');
const userActionMessage = document.getElementById('userActionMessage');

function setUserActionMessage(message, type) {
    userActionMessage.textContent = message;
    userActionMessage.className = `alert alert-${type} mt-3 mb-0`;
}

function updateUserActions() {
    const hasSelection = Boolean(dashboardUserSelect.value);
    viewUserButton.disabled = !hasSelection;
    deleteUserButton.disabled = !hasSelection;
}

async function loadDashboardUsers() {
    try {
        const response = await fetch(`${API_BASE_URL}/api/users`);
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Unable to load users.');
        }

        const candidates = result.users.filter(user => user.role !== 'admin');
        dashboardUserSelect.innerHTML = candidates.length
            ? '<option value="">Select a user</option>' + candidates.map(user =>
                `<option value="${user.id}">User ID: ${user.id} - ${user.name} - ${user.email}</option>`
            ).join('')
            : '<option value="">No candidate users found</option>';
        dashboardUserSelect.disabled = !candidates.length;
        updateUserActions();
    } catch (error) {
        dashboardUserSelect.innerHTML = '<option value="">Unable to load users</option>';
        dashboardUserSelect.disabled = true;
        setUserActionMessage(error.message || 'Unable to load users.', 'danger');
    }
}

dashboardUserSelect.addEventListener('change', updateUserActions);

viewUserButton.addEventListener('click', function() {
    if (dashboardUserSelect.value) {
        window.location.href = `manage-candidate-results.html?userId=${encodeURIComponent(dashboardUserSelect.value)}`;
    }
});

deleteUserButton.addEventListener('click', async function() {
    const userId = dashboardUserSelect.value;
    const selectedLabel = dashboardUserSelect.options[dashboardUserSelect.selectedIndex].textContent;

    if (!userId || !window.confirm(`Delete ${selectedLabel}? This action cannot be undone.`)) {
        return;
    }

    try {
        const response = await fetch(`${API_BASE_URL}/api/users/${encodeURIComponent(userId)}`, {
            method: 'DELETE'
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Unable to delete user.');
        }

        setUserActionMessage('User deleted successfully.', 'success');
        await loadDashboardUsers();
    } catch (error) {
        setUserActionMessage(error.message || 'Unable to delete user.', 'danger');
    }
});

loadDashboardUsers();
</script>

</body>
</html>
