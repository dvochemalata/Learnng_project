<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Test Papers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Test Papers</h2>
        <a href="add-test-paper.html" class="btn btn-primary">+ Add Test Paper</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Paper Name</th>
                    <th>Category</th>
                    <th>Difficulty</th>
                    <th>Questions</th>
                    <th>Duration</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<script>
async function renderTestPapers() {
    const tbody = document.querySelector('tbody');
    try {
        const response = await fetch('http://localhost:5000/api/test-papers');
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Failed to load test papers.');
        }
        const papers = result.testPapers;

        if (!papers.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No test papers found.</td></tr>';
            return;
        }

        tbody.innerHTML = papers.map((paper) => `
        <tr>
            <td>${paper.id}</td>
            <td>${paper.name}</td>
            <td>${paper.category}</td>
            <td>${paper.difficulty}</td>
            <td>${paper.questions}</td>
            <td>${paper.duration} min</td>
            <td>
                <a href="http://localhost:5000${paper.pdfUrl}" class="btn btn-sm btn-info text-white me-2" target="_blank" rel="noopener noreferrer">Open PDF</a>
                <button class="btn btn-sm btn-warning">Edit</button>
                <button class="btn btn-sm btn-danger" onclick="deletePaper(${paper.id})">Delete</button>
            </td>
        </tr>
        `).join('');
    } catch (error) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">${error.message}</td></tr>`;
    }
}

async function deletePaper(id) {
    if (!confirm('Are you sure you want to delete this test paper?')) {
        return;
    }

    try {
        const response = await fetch(`http://localhost:5000/api/test-papers/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Failed to delete test paper.');
        }

        alert('Test paper deleted successfully.');
        renderTestPapers();
    } catch (error) {
        alert(error.message || 'Unable to connect to the backend.');
    }
}

renderTestPapers();
</script>
</body>
</html>
