<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow">

        <div class="card-header">
            <h4>Add New Product</h4>
        </div>

        <div class="card-body">

            <form id="productForm" onsubmit="addProduct(event)">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input id="name" type="text" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>

                    <select id="category_id" class="form-select" required>
                        <option value="">Select Category</option>
                        <option value="1">Programming</option>
                        <option value="2">AI</option>
                        <option value="3">Data Science</option>
                        <option value="4">Data Analytics</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price</label>

                    <input id="price" type="number" step="0.01" min="0" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Stock</label>

                    <input id="stock" type="number" min="0" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Product Image</label>

                    <input id="image" type="file" class="form-control" accept="image/*">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea id="description" class="form-control" rows="4"></textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Add Product
                </button>

                <a href="manage-products.html"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

<script>
async function loadCategories() {
    const categorySelect = document.getElementById('category_id');

    try {
        const response = await fetch('http://localhost:5000/api/categories');
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'Failed to load categories');
        }

        const categories = data.categories || [];
        categorySelect.innerHTML = '<option value="">Select Category</option>' +
            categories.map(category => `<option value="${category.id}">${category.name}</option>`).join('');
    } catch (error) {
        console.error(error);
        categorySelect.innerHTML = '<option value="">Select Category</option><option value="1">Programming</option>';
    }
}

async function addProduct(event) {
    event.preventDefault();

    const payload = {
        name: document.getElementById("name").value.trim(),
        category_id: Number(document.getElementById("category_id").value),
        price: Number(document.getElementById("price").value),
        stock: Number(document.getElementById("stock").value),
        description: document.getElementById("description").value.trim(),
        image: document.getElementById("image").files[0] ? document.getElementById("image").files[0].name : null
    };

    if (!payload.name || !payload.category_id || payload.price === undefined || payload.stock === undefined) {
        alert("Please fill in all required fields.");
        return;
    }

    try {
        const response = await fetch('http://localhost:5000/api/products', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'Unable to add product');
        }

        alert('Product added successfully!');
        window.location.href = 'manage-products.html';
    } catch (error) {
        console.error(error);
        alert(error.message || 'Failed to add product.');
    }
}

loadCategories();
</script>

</body>
</html>
