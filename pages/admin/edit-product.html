<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow">

        <div class="card-header">
            <h4>Edit Product</h4>
        </div>

        <div class="card-body">

            <form id="editProductForm" onsubmit="updateProduct(event)">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input id="edit-name" type="text" class="form-control" value="Python Full Stack Bootcamp" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>

                    <select id="edit-category_id" class="form-select">
                        <option value="1">Programming</option>
                        <option value="2">AI</option>
                        <option value="3">Data Science</option>
                        <option value="4">Data Analytics</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price</label>

                    <input id="edit-price" type="number" step="0.01" min="0" class="form-control" value="499" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Stock</label>

                    <input id="edit-stock" type="number" min="0" class="form-control" value="25" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea id="edit-description" class="form-control" rows="4">Corporate training program covering Python, Django, APIs, and deployment.</textarea>
                </div>

                <button type="submit" class="btn btn-primary">
                    Update Product
                </button>

                <a href="manage-products.html"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

<script>
async function updateProduct(event) {
    event.preventDefault();

    const payload = {
        name: document.getElementById('edit-name').value.trim(),
        category_id: Number(document.getElementById('edit-category_id').value),
        price: Number(document.getElementById('edit-price').value),
        stock: Number(document.getElementById('edit-stock').value),
        description: document.getElementById('edit-description').value.trim()
    };

    try {
        const response = await fetch('http://localhost:5000/api/products/1', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'Unable to update product');
        }

        alert('Product updated successfully!');
        window.location.href = 'manage-products.html';
    } catch (error) {
        console.error(error);
        alert(error.message || 'Failed to update product.');
    }
}
</script>

</body>
</html>
