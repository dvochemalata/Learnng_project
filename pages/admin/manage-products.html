<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Products</h2>

        <a href="add-product.html" class="btn btn-primary">
            + Add Product
        </a>
    </div>

    <div class="table-responsive">

        <table class="table table-bordered table-striped">

            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="productTableBody">
                <tr>
                    <td colspan="6" class="text-center text-muted">Loading products...</td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<script>
async function loadProducts() {
    const tbody = document.getElementById('productTableBody');

    try {
        const response = await fetch('http://localhost:5000/api/products');
        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.message || 'Failed to load products');
        }

        const products = data.products || [];

        if (products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No products found.</td></tr>';
            return;
        }

        tbody.innerHTML = products.map(product => `
            <tr>
                <td>${product.id}</td>
                <td>${product.name}</td>
                <td>${product.category_name || product.category_id || 'N/A'}</td>
                <td>₹${Number(product.price).toFixed(2)}</td>
                <td>${product.stock}</td>
                <td>
                    <a href="edit-product.html" class="btn btn-sm btn-warning">
                        Edit
                    </a>

                    <button class="btn btn-sm btn-danger"
                            onclick="deleteProduct()">
                        Delete
                    </button>
                </td>
            </tr>
        `).join('');
    } catch (error) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Unable to load products.</td></tr>';
        console.error(error);
    }
}

function deleteProduct() {
    if (confirm("Are you sure you want to delete this product?")) {
        alert("Product deleted successfully.");
    }
}

loadProducts();
</script>

</body>
</html>
