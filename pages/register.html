<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Atlas Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef4ff, #f8f9fa); }
        .auth-card { max-width: 520px; margin: 60px auto; border: none; border-radius: 16px; box-shadow: 0 12px 35px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card auth-card">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4">Create Account</h2>
                <div id="registerMessage" class="alert d-none" role="alert"></div>
                <form id="registerForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="firstName">First Name</label>
                            <input id="firstName" type="text" class="form-control" placeholder="First name" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="lastName">Last Name</label>
                            <input id="lastName" type="text" class="form-control" placeholder="Last name" required>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label" for="email">Email</label>
                        <input id="email" type="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="mt-3">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" type="password" class="form-control" placeholder="Create password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4">Register</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>
                <div class="text-center mt-3">
                    <a href="../index.html" class="text-decoration-none">← Back to home</a>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
const API_BASE_URL = window.location.hostname === 'localhost'
    ? 'http://localhost:5000'
    : '';

document.getElementById('registerForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const message = document.getElementById('registerMessage');
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
        const response = await fetch(API_BASE_URL + '/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: firstName + ' ' + lastName, email, password })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Registration failed.');
        }
        window.location.href = 'candidate-login.html?registrationId=' + encodeURIComponent(result.user.id);
    } catch (error) {
        message.textContent = error.message || 'Unable to connect to the backend.';
        message.className = 'alert alert-danger';
    }
});
</script>
</html>
