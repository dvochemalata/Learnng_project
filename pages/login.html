<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Atlas Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef4ff, #f8f9fa); }
        .auth-card { max-width: 480px; margin: 80px auto; border: none; border-radius: 16px; box-shadow: 0 12px 35px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card auth-card">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4">Login</h2>
                <div id="loginMessage" class="alert d-none" role="alert"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label" for="identifier">Email or Registration ID</label>
                        <input id="identifier" type="text" class="form-control" placeholder="Enter email or Registration ID" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <input id="password" type="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button id="loginButton" type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Don’t have an account?
                    <a href="register.html">Register here</a>
                </p>
                <div class="text-center mt-3">
                    <a href="../index.html" class="text-decoration-none">← Back to home</a>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
const API_BASE_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : '';
const loginForm = document.getElementById('loginForm');
const loginMessage = document.getElementById('loginMessage');
const loginButton = document.getElementById('loginButton');
const registrationId = new URLSearchParams(window.location.search).get('registrationId');

if (registrationId) {
    document.getElementById('identifier').value = registrationId;
    loginMessage.textContent = 'Registration successful. Your Registration ID is ' + registrationId + '. Please enter your password.';
    loginMessage.className = 'alert alert-success';
}

loginForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    loginButton.disabled = true;
    loginButton.textContent = 'Logging in...';

    try {
        const response = await fetch(API_BASE_URL + '/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                identifier: document.getElementById('identifier').value.trim(),
                password: document.getElementById('password').value
            })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
            throw new Error(result.message || 'Invalid login details.');
        }

        localStorage.setItem('atlas_candidate', JSON.stringify(result.user));
        window.location.href = result.user.role === 'admin' ? 'admin/dashboard.html' : 'assessments.html';
    } catch (error) {
        loginMessage.textContent = error.message || 'Unable to connect to the backend.';
        loginMessage.className = 'alert alert-danger';
        loginButton.disabled = false;
        loginButton.textContent = 'Login';
    }
});
</script>
</html>
